name: flutter_globe_picker
description: >-
  All-in-one Flutter toolkit for countries, currencies, dial codes, date
  formats and flags, with fully customizable pickers, search, filters and a
  phone field.
version: 0.1.0
repository: https://github.com/your-username/flutter_globe_picker
issue_tracker: https://github.com/your-username/flutter_globe_picker/issues
documentation: https://github.com/your-username/flutter_globe_picker#readme

topics:
  - country
  - currency
  - phone
  - picker
  - flags

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  xml: ^7.0.1

flutter:
  assets:
    - assets/globe_data.json
    - assets/flags/4x3/
    - assets/flags/1x1/
